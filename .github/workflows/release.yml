name: Release packages and docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the next patch version
        id: version
        run: |
          PUBLISHED_VERSION="$(npm view @cortex-docs/cli version 2>/dev/null || true)"
          node scripts/set-release-version.mjs --published="$PUBLISHED_VERSION"
          npm install --package-lock-only --ignore-scripts
      - name: Install Copilot CLI
        run: npm install --global @github/copilot
      - name: Generate release notes with Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          COMMIT_RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"
          node scripts/render-changelog-prompt.mjs "$RELEASE_VERSION" "$COMMIT_RANGE" > .changelog-prompt.txt
          copilot -p "$(cat .changelog-prompt.txt)" --allow-tool='shell(git:*)' --allow-tool=write --no-ask-user
          node scripts/apply-changelog.mjs "$RELEASE_VERSION"
      - name: Make sure that release packages are valid
        run: |
          npm run format:check
          npm run pack:check
      - name: Commit and tag the release
        id: commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md package-lock.json packages/cli/package.json packages/docs-site/package.json
          git commit -m "chore(release): v${RELEASE_VERSION}"
          git tag -a "v${RELEASE_VERSION}" -m "Cortex Docs v${RELEASE_VERSION}"
          git push origin HEAD:main "v${RELEASE_VERSION}"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: publish CLI and docs MCP, then deploy docs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check
      - name: Publish the Cortex CLI
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-cli.mjs "${{ needs.prepare.outputs.version }}"
      - name: Publish the product docs MCP package
        env:
          GITHUB_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-docs-mcp.mjs "${{ needs.prepare.outputs.version }}"
      - name: Make sure that the Cloudflare zone is active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}" \
            | jq --exit-status '.success == true and .result.status == "active"'
      - name: Deploy docs.cortexdocs.dev as assets only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run --workspace=@cortex-docs/docs-ui docs:deploy
      - name: Verify the product docs static deployment
        run: >-
          node scripts/check-static-site.mjs https://docs.cortexdocs.dev
          / /docs/quickstart /api/config /api/docs /api/mcp
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/extract-release-notes.mjs "$RELEASE_VERSION" > .github-release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Cortex Docs $RELEASE_TAG" \
              --notes-file .github-release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Cortex Docs $RELEASE_TAG" \
              --notes-file .github-release-notes.md
          fi
