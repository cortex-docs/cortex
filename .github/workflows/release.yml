name: Release npm packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const expected = tag.startsWith('v') ? tag.slice(1) : tag;
          const packages = ['core', 'codegen', 'mcp-gen', 'docs-ui', 'cli'];
          for (const name of packages) {
            const manifest = JSON.parse(fs.readFileSync(`packages/${name}/package.json`, 'utf8'));
            if (manifest.version !== expected) {
              throw new Error(`${manifest.name} is ${manifest.version}; the tag requires ${expected}`);
            }
          }
          NODE
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run pack:check
      - run: npm publish --workspace=@cortex/core --access public --provenance
      - run: npm publish --workspace=@cortex/codegen --access public --provenance
      - run: npm publish --workspace=@cortex/mcp-gen --access public --provenance
      - run: npm publish --workspace=@cortex/docs-ui --access public --provenance
      - run: npm publish --workspace=@cortex/cli --access public --provenance
