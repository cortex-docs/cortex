name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [pre-release, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce the promotion path
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$PR_BASE" == "main" && "$PR_HEAD" != "pre-release" ]]; then
            echo "Only the pre-release branch can open a pull request to main."
            exit 1
          fi
          echo "The ${PR_HEAD:-push} -> ${PR_BASE:-push} flow is valid."

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run pack:check

  browser:
    name: browser
    needs: [branch-flow, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  integration:
    name: integration
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [branch-flow, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sdk
      - run: npm run test:publish:e2e
