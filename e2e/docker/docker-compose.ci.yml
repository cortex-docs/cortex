name: cortex-sdk-ci

services:
  sdk-tests:
    image: ${CORTEX_CI_IMAGE:?required}
    working_dir: /cortex
    entrypoint:
      - bash
      - e2e/docker/run-ci-test.sh
      - e2e/docker/run-sdk-tests.js
    environment:
      - MOCK_PORT=4010
      - TEST_LANGUAGES=${TEST_LANGUAGES:-}
    volumes:
      - ../..:/cortex
      - cortex-sdk-node-modules:/cortex/node_modules
      - /tmp/cortex-e2e-results:/results
      - cortex-sdk-gradle-cache:/root/.gradle

volumes:
  cortex-sdk-node-modules:
  cortex-sdk-gradle-cache:
    name: cortex-sdk-gradle-cache
    external: true
